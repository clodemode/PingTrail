entries:
  - slug: spec-ping-trail-hop-ladder-latency-attribution
    title: 'SPEC: PING_TRAIL — parallel hop-ladder ping, stacked-bar latency attribution'
    domain: lore
    lore_type: spec
    app_scope: ping_trail
    lair: logic
    character_slug: clogger
    tags:
      - ping-trail
      - new-app
      - clogger
      - latency
      - echarts
      - diagnostics
      - spec
    status: canonical
    description: |-
      PING_TRAIL answers one question: "our internet feels slow — WHICH SEGMENT is injecting the latency?"

      METHOD. At each tick, fire ICMP echo at every rung of a TRAIL (an ordered ladder of targets reaching progressively deeper into the internet) SIMULTANEOUSLY, in parallel, in one shot. Simultaneity is the whole premise: every rung experiences the same network conditions in that instant, so the RTT differences between rungs are attributable to the segments between them. Sequential probing compares different moments and makes the subtraction meaningless.

      THE LADDER (default rungs, ordered by depth):
        0 loopback    127.0.0.1              - host scheduling noise floor
        1 gateway     default gw (192.168.x.1) - LAN + router responsiveness
        2 isp_hop1    traceroute hop 2         - last mile (modem/ONT/coax/fiber)
        3 isp_hop2    traceroute hop 3-4       - ISP backhaul / regional aggregation
        4 isp_dns     resolver from resolv.conf/DHCP - ISP infrastructure
        5 public_dns  1.1.1.1 and 8.8.8.8      - open-internet edge
        6 anchor      distant well-known host  - long-haul transit

      ATTRIBUTION. Each rung's path CONTAINS the shallower rung's path, so the incremental latency of a segment is the delta between adjacent rungs:
        segment[i] = rtt[rung i] - rtt[rung i-1]
      Stack the segments and the bar's total height equals the RTT to the deepest rung. The segment whose band swells is the one injecting the latency. That band is the answer.

      RENDERING: STACKED BAR, never stacked line/area. Kris, 2026-08-01: "you cannot assume response time between pings." Each bar is one discrete sample tick. A line or area silently interpolates latency across the gap between ticks — inventing measurements that were never taken. Bars assert only what was sampled. A tick where every rung timed out renders as a VOID bar (gap), never a bridge between neighbours.

      VANTAGE. Measurement is decoupled from presentation. The Django app never pings; it stores and graphs. A host-side prober owns the ICMP and POSTs results to an ingest endpoint. Rationale is a hard constraint, not a preference: inside Docker the container's default gateway is the bridge (172.x.x.1), NOT the house router, and on macOS Docker Desktop the "host" network is a Linux VM behind its own NAT. A containerized prober would measure the bridge and report a fiction. The Vantage model also buys multi-point measurement later (home Mac + a Fly instance triangulating the same trail).

      Owner: CLOGGER (inspector, "Watching the Pipes"). Surface work: SCOUT.
    dont: |-
      DONT render the attribution as a stacked LINE or AREA chart — that interpolates latency between sample ticks and fabricates measurements never taken. Stacked BAR only, one bar per discrete tick, VOID bar for a fully-timed-out tick.

      DONT clamp a negative segment delta to zero. Negative deltas are REAL and diagnostic, not noise: routers punt ICMP addressed TO their own control plane to a slow path, while forwarding ICMP THROUGH them on the fast path. So a deeper rung legitimately answers FASTER than a shallower one. Silently clamping hides a genuine signal and makes the chart lie. Persist every raw RTT per rung; compute deltas at render; surface a negative delta as a distinct inversion marker.

      DONT probe rungs sequentially or stagger them — parallel simultaneous fire is the premise that makes the subtraction valid.

      DONT treat packet loss as a missing datapoint. Loss is first-class signal: a rung at 100% loss whose DOWNSTREAM neighbour still answers is the strongest diagnostic the tool produces (that box is deprioritizing ICMP, not dropping traffic).

      DONT run the prober inside the Docker container — it would measure the bridge gateway, not the real router.

      DONT use a TIME x-axis in ECharts for the sample series — a category axis is required so evenly-spaced bars never imply continuity across a collection gap.

      DONT bring in a second component framework — Bootstrap 5.3 + HTMX + ECharts, matching the fleet.
    do_this: |-
      Django TARGET_APP `ping_trail`, container `about-ping-trail-1` on :8030, SQLite at /data/db.sqlite3 — scaffold mirrors `mango/` (the newest TARGET_APP): app/config + app/<appname>, Dockerfile, docker-compose.yml `include:`d by ABOUT/docker-compose.yml, /healthz, KEY_PREFIX, gunicorn --reload dev CMD.

      MODELS: Vantage (where a prober runs) - Trail (named ladder, belongs to a Vantage) - Rung (ordered target: depth, kind in loopback/gateway/isp_hop/isp_dns/public_dns/anchor, host, label, discovered_at) - Sample (one tick: trail, fired_at, unique per trail+fired_at) - Probe (one rung's result in one sample: rtt_ms nullable, sent, received, loss_pct, ttl, error). Probe.rtt_ms NULL means timeout, distinct from 0.

      COMMANDS: `discover_trail` (read default gateway, traceroute to 1.1.1.1, parse resolv.conf, auto-build the ladder — idempotent, re-runnable when the ISP path changes); `ping_sweep --loop --interval 30` (host-side prober: parallel fire, POST to ingest); `trail_report` (CLI attribution table, the deterministic verifier).

      SURFACE: single dense canvas per spec-bloodride-ui-density-and-context — persistent header, trail selector with live counts, ECharts stacked bar (category x-axis), loss overlay, inversion markers, and an inline-expandable per-tick raw-RTT table (HTMX, no modals per spec-no-modals-htmx-inline-expansion). Stacked-bar labels must follow `echarts-stacked-label-total` — pre-compute bucket totals; p.value gives one segment only.

      VERIFY deterministically before browser: seed a fixture trail with a known injected delay at a known rung, run trail_report, assert the attribution names that rung.
    do_also: |-
      REGISTRATION (DONE 2026-08-02): `ping_trail` is now a registered AppScope member (INTENT/models/fools.py, migration 0064_alter_foolslore_app_scope), an `include:` + `/app/fleet/ping_trail` mount in ABOUT/docker-compose.yml, a clone line in CLODE/CLAUDE.md's self-boot list, and its own sibling repo. This spec is re-homed to app_scope='ping_trail' with its YAML at ping_trail/LORE/clogger/. NOTE the repo is `clodemode/ping-trail` with a HYPHEN (GitHub normalized the underscore) while the local DIRECTORY stays `ping_trail` — see todo-ping-trail-repo-remote-and-clone-line-use-stale-underscore-name. Still outstanding: no KRISPY_KRATES krate/spring, and no dedicated MCP toolbox (no `ping_trail_manage` tool) — use `docker exec about-ping-trail-1 python manage.py <cmd>`.

      PORT 8030 chosen as next free in the fleet ladder (formicary :8010, mango :8020). Verified free against every compose in the workspace on 2026-08-01.

      ICMP PRIVILEGE: unprivileged ICMP datagram sockets (SOCK_DGRAM/IPPROTO_ICMP) work on macOS without root and are strongly preferred over raw sockets or shelling to /sbin/ping. Falling back to parsing `ping` stdout is acceptable only if the datagram socket path fails, and the fallback must still fire all rungs in parallel.

      CADENCE: default 30s tick. Ship the prober loop DISABLED by default per `leaning-beat-schedule-must-ship-disabled` — an operator starts it explicitly.

      FUTURE: multi-vantage triangulation (same trail probed from home Mac + a Fly instance) is why Vantage exists as a model on day one rather than a hardcoded constant. Do not build the second vantage yet.
