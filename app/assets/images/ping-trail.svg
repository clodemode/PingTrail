<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PING_TRAIL">
  <title>PING_TRAIL</title>
  <!-- The ladder: rungs reaching progressively deeper, stacked as bars. -->
  <rect x="6"  y="42" width="9" height="14" rx="2" fill="#0d6efd"/>
  <rect x="18" y="34" width="9" height="22" rx="2" fill="#fd7e14"/>
  <rect x="30" y="18" width="9" height="38" rx="2" fill="#20c997"/>
  <rect x="42" y="10" width="9" height="46" rx="2" fill="#d63384"/>
  <!-- Inversion marker: a deeper rung answering faster. Never clamped away. -->
  <path d="M55.5 22 l4.5 4.5 -4.5 4.5 -4.5 -4.5 z" fill="#d6336c"/>
  <!-- Baseline -->
  <rect x="4" y="57" width="56" height="2.5" rx="1.25" fill="#55607a"/>
</svg>
